services:
  - type: web
    name: smart-ultrasonic-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: RADAR_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-ultrasonic-radar-db
          property: connectionString

databases:
  - name: smart-ultrasonic-radar-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: radar
    user: radar_user
